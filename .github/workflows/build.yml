name: Build on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build: 
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses : actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name : Setup pnpm 
        run : npm install -g pnpm
          
      - name: Install Dependencies
        run: pnpm install

      - name : generate prisma client
        run  : pnpm db:generate
        
      - name: Run Build
        run: pnpm run build